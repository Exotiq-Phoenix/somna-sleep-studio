<script>const METHODS=[{"id":"easy-4-6-breathing","name":"Easy 4–6 breathing","category":"Breath","min":4,"evidence":"supported","summary":"A gentle longer exhale without breath-holding.","steps":["Breathe in through the nose for 4 comfortable counts.","Exhale softly for 6 counts without forcing the breath.","Continue at a comfortable pace; shorten the counts if you need to."],"tags":["racing thoughts","anxiety"],"flags":["nohold","eyesclosed","nd"]},{"id":"five-five-breathing","name":"Five-five breathing","category":"Breath","min":5,"evidence":"supported","summary":"Slow, even breathing at roughly six breaths per minute.","steps":["Settle your shoulders and unclench your jaw.","Inhale for a comfortable count of 5.","Exhale for 5; return to normal breathing if dizzy."],"tags":["body tension","anxiety"],"flags":["nohold","eyesclosed"]},{"id":"4-7-8-breathing","name":"4–7–8 breathing","category":"Breath","min":3,"evidence":"limited","summary":"A familiar breathing pattern; long holds are optional and not necessary.","steps":["Inhale gently for about 4 counts.","If comfortable, pause up to 7 counts; otherwise skip the hold.","Exhale slowly for about 8 counts, shortening as needed."],"tags":["breathing","anxiety"],"flags":["eyesclosed"]},{"id":"soft-box-breathing","name":"Soft box breathing","category":"Breath","min":4,"evidence":"limited","summary":"A balanced rhythm with optional brief pauses.","steps":["Breathe in for about 4 counts.","Pause for up to 4 counts, or skip if uncomfortable.","Breathe out for 4; pause only if easy."],"tags":["anxiety","overwhelmed"],"flags":["eyesclosed"]},{"id":"no-count-breathing","name":"No-count breathing","category":"Breath","min":3,"evidence":"supported","summary":"Let the breath slow without tracking numbers.","steps":["Notice one ordinary inhale.","Allow the next exhale to feel soft and unhurried.","Return to the physical sensation of air instead of counting."],"tags":["counting stress","ADHD"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"gentle-physiological-sigh","name":"Gentle physiological sigh","category":"Breath","min":2,"evidence":"limited","summary":"A brief double inhale followed by one easy exhale.","steps":["Take a small inhale through the nose.","Take a tiny second sip of air, only if comfortable.","Let out one unforced exhale, then breathe normally."],"tags":["tension","quick reset"],"flags":["nohold","nd"]},{"id":"longer-exhale-ladder","name":"Longer-exhale ladder","category":"Breath","min":5,"evidence":"limited","summary":"Gradually lengthen exhalation without strain.","steps":["Begin at an easy in-3 / out-4 rhythm.","If that feels good, try out-5 or out-6.","Stay with the easiest rhythm; do not chase a number."],"tags":["anxiety","restless"],"flags":["nohold"]},{"id":"hand-on-belly-anchor","name":"Hand-on-belly anchor","category":"Breath","min":5,"evidence":"limited","summary":"Use gentle movement as a tactile breathing cue.","steps":["Place your hand over your abdomen or ribs.","Feel natural rising and falling without taking deeper breaths.","If your mind drifts, return to the warmth of your hand."],"tags":["sensory","body"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"humming-exhale","name":"Humming exhale","category":"Breath","min":3,"evidence":"limited","summary":"Gentle humming for an easy focus point.","steps":["Breathe in normally.","Exhale with a quiet comfortable hum.","Pause and return to ordinary breathing before repeating."],"tags":["sound","restlessness"],"flags":["nohold","nocount"]},{"id":"breath-following","name":"Breath following","category":"Breath","min":8,"evidence":"supported","summary":"Mindful noticing rather than deliberate control.","steps":["Let breathing happen on its own.","Notice the beginning, middle, and end of an exhale.","Whenever you lose track, begin again without judgment."],"tags":["mindfulness","overthinking"],"flags":["nohold","nocount","eyesclosed"]},{"id":"progressive-muscle-relaxation","name":"Progressive muscle relaxation","category":"Body","min":12,"evidence":"supported","summary":"Tense and release muscle groups to notice the contrast.","steps":["Gently tense your feet for 3–5 seconds, then completely release.","Repeat with legs, hands, shoulders and face, one area at a time.","Skip painful areas and let all muscles rest at the end."],"tags":["body tension","stress"],"flags":["eyesclosed"]},{"id":"no-tension-body-scan","name":"No-tension body scan","category":"Body","min":10,"evidence":"supported","summary":"Scan the body without tightening muscles.","steps":["Start noticing your feet against the mattress.","Move attention slowly up the legs, torso, arms and face.","At each area, let it be exactly as it is."],"tags":["restlessness","pain sensitive"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"jaw-and-tongue-release","name":"Jaw and tongue release","category":"Body","min":2,"evidence":"limited","summary":"Unclench the mouth, jaw, and forehead.","steps":["Rest the tip of your tongue lightly behind the upper front teeth.","Allow teeth to part slightly and relax your jaw.","Soften your brow and the space around the eyes."],"tags":["tension","quick reset"],"flags":["nohold","nocount","eyesclosed"]},{"id":"shoulder-drop","name":"Shoulder drop","category":"Body","min":2,"evidence":"limited","summary":"Let your upper body release effort.","steps":["Raise your shoulders very slightly on an inhale.","Release them as you breathe out, without forcing.","Feel your arms sink onto the bed."],"tags":["tension"],"flags":["nohold","nocount"]},{"id":"weighted-body-imagery","name":"Weighted body imagery","category":"Body","min":7,"evidence":"limited","summary":"Imagine the bed supporting your weight.","steps":["Find one comfortable contact point with the mattress.","Imagine the bed carrying more and more of your weight.","Allow the sensation to spread through the rest of the body."],"tags":["imagery","body"],"flags":["nohold","nocount","eyesclosed"]},{"id":"warmth-by-attention","name":"Warmth by attention","category":"Body","min":7,"evidence":"limited","summary":"Direct gentle attention to warmth rather than muscle effort.","steps":["Notice a naturally warm place, such as the hands under a blanket.","Imagine warmth spreading one small area at a time.","Return to the actual feel of the blankets if imagery is hard."],"tags":["body","imagery"],"flags":["nohold","nocount","eyesclosed"]},{"id":"autogenic-phrases","name":"Autogenic phrases","category":"Body","min":10,"evidence":"limited","summary":"Repeat simple phrases about heaviness and warmth.","steps":["Silently say, “My hands can rest.”","Then say, “My shoulders are free to soften.”","Repeat short phrases slowly, without trying to create sensations."],"tags":["hypnosis","body"],"flags":["nohold","eyesclosed"]},{"id":"body-part-gratitude","name":"Body-part gratitude","category":"Body","min":6,"evidence":"preference","summary":"Offer neutral appreciation to your tired body.","steps":["Notice your feet and think, “They have done enough today.”","Move upward through your body at your own pace.","Let appreciation be optional; neutral noticing is enough."],"tags":["mental reset"],"flags":["nohold","nocount","eyesclosed"]},{"id":"restless-legs-release","name":"Restless legs release","category":"Body","min":4,"evidence":"limited","summary":"Gentle movement before settling rather than fighting the urge.","steps":["If your legs need to move, stretch or flex them gently outside a painful range.","Place them in a comfortable position with support.","Return to stillness only when it feels comfortable."],"tags":["restless","ADHD"],"flags":["nohold","nocount","nd"]},{"id":"pillow-supported-reset","name":"Pillow-supported reset","category":"Body","min":4,"evidence":"preference","summary":"Adjust contact points to reduce positional discomfort.","steps":["Adjust your pillow so neck and head feel supported.","Place a pillow beneath knees or between knees if comfortable.","Take two ordinary breaths and let your body decide if it is ready to settle."],"tags":["sensory","body"],"flags":["nohold","nocount","nd"]},{"id":"cognitive-shuffle","name":"Cognitive shuffle","category":"Mind","min":10,"evidence":"limited","summary":"Think of disconnected, low-stakes words or images.","steps":["Choose a simple letter or word.","Think of unrelated items beginning with that letter, one every few seconds.","Avoid building a story; switch letters when ideas run out."],"tags":["racing thoughts","ADHD","imagery"],"flags":["nohold","eyesclosed","nd"]},{"id":"alphabet-categories","name":"Alphabet categories","category":"Mind","min":10,"evidence":"preference","summary":"Use a boring category to occupy a busy mind.","steps":["Choose an easy topic like foods, animals or places.","Think of one item for A, then B, and so on.","Skip letters freely; do not treat it as a quiz."],"tags":["ADHD","racing thoughts"],"flags":["nohold","eyesclosed","nd"]},{"id":"thought-parking","name":"Thought parking","category":"Mind","min":5,"evidence":"supported","summary":"Put unfinished tasks somewhere outside your head.","steps":["Write down the most persistent unfinished thought.","Add only the very next useful step for tomorrow.","Close the note and tell yourself: “It is stored for later.”"],"tags":["racing thoughts","ADHD","worry"],"flags":["nohold","nocount","nd"]},{"id":"worry-window","name":"Worry window","category":"Mind","min":10,"evidence":"supported","summary":"Set aside a bounded time earlier in the evening to worry on purpose.","steps":["Before bed, write one concern at a time.","For each concern, identify an action or mark it “not solvable tonight.”","End the window and leave the page for tomorrow."],"tags":["anxiety","worry"],"flags":["nohold","nocount","nd"]},{"id":"paradoxical-intention","name":"Paradoxical intention","category":"Mind","min":8,"evidence":"limited","summary":"Stop trying to force sleep; permit quiet wakefulness.","steps":["Get comfortable and give up the task of falling asleep.","Keep eyes softly open or closed, whichever feels calm.","Allow yourself to rest without testing whether you are sleepy."],"tags":["sleep pressure","anxiety"],"flags":["nohold","nocount","nd"]},{"id":"name-it-let-it-pass","name":"Name it, let it pass","category":"Mind","min":5,"evidence":"supported","summary":"Lightly label thoughts instead of wrestling with them.","steps":["When a thought arrives, silently label it “planning,” “remembering,” or “worrying.”","Do not debate it or follow its story.","Return to the feeling of your body against the bed."],"tags":["overthinking","mindfulness"],"flags":["nohold","nocount","eyesclosed"]},{"id":"one-gentle-word","name":"One gentle word","category":"Mind","min":5,"evidence":"preference","summary":"Repeat one neutral word as an anchor.","steps":["Choose a word such as “soft,” “rest,” or “quiet.”","Let it appear once on each ordinary exhale.","If the word becomes annoying, drop it."],"tags":["racing thoughts"],"flags":["nohold","eyesclosed","nd"]},{"id":"counting-backwards-lightly","name":"Counting backwards lightly","category":"Mind","min":6,"evidence":"preference","summary":"Gentle monotony without a performance goal.","steps":["Start at any number, such as 200.","Count down in ones slowly, with no requirement to finish.","When distracted, start anywhere instead of correcting mistakes."],"tags":["racing thoughts"],"flags":["nohold","eyesclosed"]},{"id":"three-neutral-observations","name":"Three neutral observations","category":"Mind","min":3,"evidence":"limited","summary":"Move from judgments to plain sensory facts.","steps":["Notice one contact point with the bed.","Notice one distant, ordinary sound.","Notice one part of your body that does not need fixing."],"tags":["anxiety","sensory"],"flags":["nohold","nocount","nd"]},{"id":"gentle-self-permission","name":"Gentle self-permission","category":"Mind","min":4,"evidence":"preference","summary":"Reduce performance pressure around sleep.","steps":["Try: “I can rest even if I am awake.”","Let the next breath happen naturally.","Repeat only if the phrase feels reassuring."],"tags":["sleep pressure"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"safe-place-imagery","name":"Safe-place imagery","category":"Visualization","min":12,"evidence":"limited","summary":"Build an imaginary place with only the details you enjoy.","steps":["Imagine one setting that feels private and safe.","Choose one comfortable detail: temperature, texture or sound.","Stay there without needing to see a clear picture."],"tags":["hypnosis","imagery","anxiety"],"flags":["nohold","nocount","eyesclosed"]},{"id":"night-train","name":"Night train","category":"Visualization","min":12,"evidence":"preference","summary":"Let a fictional train carry you through a calm landscape.","steps":["Imagine sitting in a comfortable seat by the window.","Notice the slow rhythm of the carriage.","Let the scenery pass without needing to remember it."],"tags":["hypnosis","story"],"flags":["nohold","nocount","eyesclosed"]},{"id":"floating-cloud","name":"Floating cloud","category":"Visualization","min":9,"evidence":"preference","summary":"Use slow motion as a mental anchor.","steps":["Imagine a wide soft cloud in an open sky.","Let the cloud drift gradually without choosing its destination.","Rest in the feeling of being supported."],"tags":["hypnosis","imagery"],"flags":["nohold","nocount","eyesclosed"]},{"id":"quiet-library","name":"Quiet library","category":"Visualization","min":11,"evidence":"preference","summary":"A low-demand environment for an active mind.","steps":["Imagine a softly lit library with no one waiting for you.","Notice the textures of the books, shelf and chair.","Allow one word or title to fade gently into silence."],"tags":["ADHD","story"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"rainy-cabin","name":"Rainy cabin","category":"Visualization","min":12,"evidence":"preference","summary":"Warm shelter and steady imaginary rain.","steps":["Imagine a comfortable cabin with rain on the roof.","Feel warm fabric beneath your hands.","Let the sound be repetitive and predictable."],"tags":["imagery","cozy"],"flags":["nohold","nocount","eyesclosed"]},{"id":"slow-elevator","name":"Slow elevator","category":"Visualization","min":8,"evidence":"preference","summary":"Imagine descending through a series of calm floors.","steps":["Picture a quiet, spacious elevator.","With each imagined floor, allow one small muscle group to soften.","Stop the sequence wherever you feel comfortable."],"tags":["hypnosis","body"],"flags":["nohold","nocount","eyesclosed"]},{"id":"color-wash","name":"Color wash","category":"Visualization","min":8,"evidence":"preference","summary":"Let a single gentle color slowly fill the scene.","steps":["Choose a dim comfortable color such as amber or slate.","Imagine it spreading through an otherwise dark scene.","Let the color fade toward darkness without trying to maintain an image."],"tags":["color","imagery"],"flags":["nohold","nocount","eyesclosed"]},{"id":"five-senses-scene","name":"Five senses scene","category":"Visualization","min":10,"evidence":"limited","summary":"Use sound and touch to imagine without vivid visual imagery.","steps":["Choose a familiar peaceful setting.","Notice an imagined sound, then texture, then temperature.","Skip sight entirely if mental imagery is difficult."],"tags":["aphantasia","ADHD","imagery"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"unfinished-story","name":"Unfinished story","category":"Visualization","min":12,"evidence":"preference","summary":"Allow a gentle story to become less and less coherent.","steps":["Start with a simple scene such as a quiet walk.","Let minor details change without correcting them.","When the plot slips away, let it go."],"tags":["story","ADHD"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"stars-at-a-distance","name":"Stars at a distance","category":"Visualization","min":10,"evidence":"preference","summary":"Imagine a dark, non-flashing night sky.","steps":["Imagine a distant still sky with a handful of stars.","Choose one point and notice the wide quiet space around it.","Allow the stars to blur and fade out."],"tags":["imagery"],"flags":["nohold","nocount","eyesclosed"]},{"id":"stimulus-control","name":"Stimulus control","category":"CBT-I","min":10,"evidence":"guideline","summary":"Rebuild the association between bed and sleepiness.","steps":["Go to bed when genuinely sleepy, rather than only because the clock says so.","If you feel wide awake and frustrated for roughly 20 minutes, get up without clock-watching.","Do something calm in dim light and return when sleepy."],"tags":["insomnia","wake at night"],"flags":["nohold","nocount"]},{"id":"consistent-wake-time","name":"Consistent wake time","category":"CBT-I","min":3,"evidence":"guideline","summary":"A stable morning anchor for the sleep-wake rhythm.","steps":["Pick a realistic wake time you can usually keep.","Get out of bed near that time even after a difficult night, if safe and feasible.","Adjust gradually rather than attempting extreme changes."],"tags":["routine","insomnia"],"flags":["nohold","nocount"]},{"id":"sleep-pressure-reset","name":"Sleep pressure reset","category":"CBT-I","min":8,"evidence":"guideline","summary":"Replace fighting for sleep with a quiet break.","steps":["Notice when you are lying in bed awake and getting tense.","Leave the bed briefly for dim, unstimulating activity.","Return as drowsiness arrives; avoid watching minutes pass."],"tags":["insomnia","sleep pressure"],"flags":["nohold","nocount"]},{"id":"cognitive-reframing","name":"Cognitive reframing","category":"CBT-I","min":8,"evidence":"supported","summary":"Question catastrophic predictions about poor sleep.","steps":["Write or name one thought such as “Tomorrow will be impossible.”","Ask what a more balanced, realistic statement would be.","Try “Tomorrow may be harder, and I can still take it one step at a time.”"],"tags":["worry","anxiety"],"flags":["nohold","nocount","nd"]},{"id":"sleep-diary","name":"Sleep diary","category":"CBT-I","min":3,"evidence":"guideline","summary":"Track patterns without constantly watching the clock.","steps":["In the morning, note bedtime and approximate time to sleep.","Record wake time and anything significant, without precision pressure.","Look for trends over many days, not a single night."],"tags":["tracking","routine"],"flags":["nohold","nocount","nd"]},{"id":"bedroom-cue-reset","name":"Bedroom cue reset","category":"CBT-I","min":5,"evidence":"supported","summary":"Let the bedroom become a lower-stimulation space.","steps":["Dim direct lights and reduce distracting notifications.","Make room temperature and bedding comfortable where possible.","Choose one repeatable quiet cue you associate with winding down."],"tags":["environment"],"flags":["nohold","nocount"]},{"id":"sleep-effort-release","name":"Sleep-effort release","category":"CBT-I","min":8,"evidence":"supported","summary":"Reduce attempts to control the exact moment of sleep.","steps":["Stop checking whether you feel sleepy.","Choose a gentle restful activity instead of “working” at sleep.","Let sleep arrive on its own time."],"tags":["sleep pressure","ADHD"],"flags":["nohold","nocount","nd"]},{"id":"sleep-compression-learn-first","name":"Sleep compression—learn first","category":"CBT-I","min":4,"evidence":"guideline","summary":"An educational overview; do not self-prescribe restrictive sleep schedules.","steps":["CBT-I may involve adjusting time in bed to consolidate sleep.","A trained clinician considers daytime sleepiness, other health conditions and safety.","Use an evidence-based CBT-I service before starting a sleep restriction plan."],"tags":["insomnia","education"],"flags":["nohold","nocount"]},{"id":"circadian-morning-light","name":"Circadian morning light","category":"CBT-I","min":5,"evidence":"supported","summary":"A daytime habit that can support a steadier rhythm.","steps":["After waking, seek natural outdoor light when practical.","Combine it with the same wake-time anchor.","Avoid staring at the sun; timing and duration vary by season."],"tags":["routine","circadian"],"flags":["nohold","nocount"]},{"id":"caffeine-cutoff-experiment","name":"Caffeine cutoff experiment","category":"CBT-I","min":5,"evidence":"supported","summary":"Track whether afternoon stimulants interfere with sleep.","steps":["Note when you usually drink coffee, energy drinks or cola.","Try shifting the last serving earlier for several days.","Compare your sleep experience without expecting one-night proof."],"tags":["routine","circadian"],"flags":["nohold","nocount"]},{"id":"brown-noise-cocoon","name":"Brown-noise cocoon","category":"Sensory","min":10,"evidence":"limited","summary":"A soft low-frequency background that may mask distractions.","steps":["Set a low, comfortable volume.","Listen for whether the background masks intermittent noise.","If it annoys you, stop; sound is optional."],"tags":["sound","ADHD"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"pink-noise-drift","name":"Pink-noise drift","category":"Sensory","min":10,"evidence":"limited","summary":"Gentler frequency balance than white noise, for some listeners.","steps":["Begin quietly and avoid high volume.","Listen for 1–2 minutes to see if it feels comfortable.","Stop if the sound holds your attention or bothers you."],"tags":["sound","ADHD"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"rain-mask-soundscape","name":"Rain-mask soundscape","category":"Sensory","min":10,"evidence":"limited","summary":"A steady rain-like texture to mask random noises.","steps":["Choose a consistent, non-surprising rain texture.","Keep it quieter than normal conversation.","Let it fade after you feel settled."],"tags":["sound","environment"],"flags":["nohold","nocount","eyesclosed"]},{"id":"low-light-routine","name":"Low-light routine","category":"Sensory","min":5,"evidence":"supported","summary":"Reduce bright visual stimulation before sleep.","steps":["Dim intense overhead lights and your screen.","Select a dark, warm screen appearance.","Switch to eyes-closed audio as soon as it is comfortable."],"tags":["light","environment"],"flags":["nohold","nocount","nd"]},{"id":"temperature-check","name":"Temperature check","category":"Sensory","min":3,"evidence":"supported","summary":"Adjust the physical environment for comfort.","steps":["Feel whether your feet, hands or torso are too warm or cold.","Adjust blanket, socks or ventilation as needed.","Choose comfort over any exact temperature rule."],"tags":["environment","body"],"flags":["nohold","nocount"]},{"id":"texture-anchor","name":"Texture anchor","category":"Sensory","min":5,"evidence":"preference","summary":"Use tactile sensation as a low-effort focus.","steps":["Touch an edge of the blanket with your fingertips.","Notice its texture, warmth and weight.","Return to that feeling when your mind wanders."],"tags":["sensory","ADHD"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"earplug-or-noise-test","name":"Earplug-or-noise test","category":"Sensory","min":4,"evidence":"preference","summary":"Choose silence or masking noise based on preference.","steps":["Listen for the noises that are actually disruptive.","Try a safe, comfortable earplug or quiet masking sound.","Keep whichever feels less noticeable; neither is universally better."],"tags":["environment","sound"],"flags":["nohold","nocount"]},{"id":"scent-neutral-space","name":"Scent-neutral space","category":"Sensory","min":3,"evidence":"preference","summary":"Avoid distracting strong aromas and airflow irritants.","steps":["Notice whether perfumes, candles or air fresheners feel stimulating.","Remove irritating scents where practical.","Choose fresh, comfortable air without adding fragrance."],"tags":["environment"],"flags":["nohold","nocount"]},{"id":"pressure-free-blanket","name":"Pressure-free blanket","category":"Sensory","min":5,"evidence":"preference","summary":"Find a comfortable weight and tuck without restricting movement.","steps":["Adjust blanket weight and tightness to your preference.","Ensure you can move and breathe freely.","Release any pressure that feels claustrophobic or uncomfortable."],"tags":["sensory","body"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"minimal-input-mode","name":"Minimal-input mode","category":"Sensory","min":5,"evidence":"preference","summary":"Remove all cues except one that helps.","steps":["Mute narration or sounds you do not need.","Turn off the visual animation if it feels busy.","Keep only darkness, a simple anchor or silence."],"tags":["ADHD","overwhelmed"],"flags":["nohold","nocount","nd"]},{"id":"random-word-cards","name":"Random-word cards","category":"ADHD","min":10,"evidence":"limited","summary":"A low-pressure visual or spoken cognitive shuffle.","steps":["Draw a random, neutral word.","Imagine its shape, texture or meaning for a moment.","Draw the next unrelated word; no story needed."],"tags":["racing thoughts","visual"],"flags":["nohold","nocount","nd"]},{"id":"micro-step-wind-down","name":"Micro-step wind-down","category":"ADHD","min":5,"evidence":"preference","summary":"Break winding down into small choices.","steps":["Choose only one action: dim light, plug in phone or adjust blanket.","Complete it without planning the rest of the night.","Choose a second only if needed; stop at any point."],"tags":["overwhelmed","routine"],"flags":["nohold","nocount","nd"]},{"id":"sensory-channel-switch","name":"Sensory channel switch","category":"ADHD","min":5,"evidence":"preference","summary":"Try touch instead of imagery or sound.","steps":["Notice whether sound, pictures or body sensations are becoming annoying.","Switch to a quieter channel, such as tactile contact with a pillow.","You can switch back whenever needed."],"tags":["ADHD","autistic friendly"],"flags":["nohold","nocount","nd"]},{"id":"low-demand-mental-playlist","name":"Low-demand mental playlist","category":"ADHD","min":8,"evidence":"preference","summary":"Use familiar neutral memories, not emotionally charged content.","steps":["Pick an ordinary place you know well.","Recall 3 tiny neutral details without developing a story.","Move to another place if you become emotionally engaged."],"tags":["racing thoughts","ADHD"],"flags":["nohold","nocount","nd"]},{"id":"task-dump-in-60-seconds","name":"Task dump in 60 seconds","category":"ADHD","min":2,"evidence":"supported","summary":"Unload urgent thoughts with almost no friction.","steps":["Open the quick note and list what your brain keeps repeating.","Choose one next step, not a complete plan.","Close the note before turning it into a project."],"tags":["racing thoughts","ADHD"],"flags":["nohold","nocount","nd"]},{"id":"wiggle-then-stillness","name":"Wiggle then stillness","category":"ADHD","min":3,"evidence":"preference","summary":"Allow brief movement before rest.","steps":["Gently wiggle toes, fingers or shoulders for a few seconds.","Release and notice how the bed feels.","Repeat once if helpful; stillness is not a test."],"tags":["restless","ADHD"],"flags":["nohold","nocount","nd"]},{"id":"external-voice-focus","name":"External voice focus","category":"ADHD","min":10,"evidence":"limited","summary":"Let gentle narration carry part of your attention.","steps":["Choose an undemanding narrated session.","Keep playback slow enough to be easy but not demanding.","Feel free to stop listening before it ends."],"tags":["hypnosis","ADHD"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"predictable-repetition","name":"Predictable repetition","category":"ADHD","min":7,"evidence":"preference","summary":"A repeated phrase or cue with no surprises.","steps":["Choose a plain word or soft repeated sound.","Let it repeat without requiring an answer.","If it becomes irritating, change or stop it."],"tags":["ADHD","racing thoughts"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"one-tool-night","name":"One-tool night","category":"ADHD","min":5,"evidence":"preference","summary":"Avoid decision fatigue by selecting only one technique.","steps":["Choose whichever technique felt easiest on a previous night.","Do not compare ten alternatives tonight.","Use the same one for a few minutes and then let it go."],"tags":["overwhelmed","ADHD"],"flags":["nohold","nocount","nd"]},{"id":"no-visualization-option","name":"No-visualization option","category":"ADHD","min":8,"evidence":"preference","summary":"A script for people who cannot or do not want to see mental pictures.","steps":["Ignore invitations to visualize scenes.","Focus on words, rhythm or actual touch instead.","Let the narration become ordinary background."],"tags":["aphantasia","autistic friendly"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"two-minute-shutdown","name":"Two-minute shutdown","category":"Routine","min":2,"evidence":"supported","summary":"A tiny repeatable sequence to signal bedtime.","steps":["Turn down the lights and enable Do Not Disturb.","Put tomorrow’s first task on one line if needed.","Choose one quiet activity; end your routine there."],"tags":["routine","quick reset"],"flags":["nohold","nocount","nd"]},{"id":"phone-boundary","name":"Phone boundary","category":"Routine","min":4,"evidence":"supported","summary":"Reduce stimulating screen use without a rigid ban.","steps":["Turn on night mode and mute distracting alerts.","Put your phone face down or use audio only.","Leave scrolling, messages and checking for tomorrow."],"tags":["routine","light"],"flags":["nohold","nocount","nd"]},{"id":"tomorrow-anchor","name":"Tomorrow anchor","category":"Routine","min":3,"evidence":"preference","summary":"Make the next morning feel manageable.","steps":["Choose a realistic first action tomorrow.","Set out anything you need if doing so feels easy.","Stop planning after that single action."],"tags":["worry","ADHD"],"flags":["nohold","nocount","nd"]},{"id":"brief-gentle-stretch","name":"Brief gentle stretch","category":"Routine","min":5,"evidence":"limited","summary":"Easy movement to release comfort-related tension.","steps":["Choose a non-painful stretch for neck, shoulders or calves.","Move slowly without trying to improve flexibility.","Finish in a resting position with normal breathing."],"tags":["body","restlessness"],"flags":["nohold","nocount"]},{"id":"dim-reading-detour","name":"Dim-reading detour","category":"Routine","min":10,"evidence":"supported","summary":"A quiet off-bed activity when sleep is not happening.","steps":["Leave the bed if frustration is building.","Read something ordinary in dim light without clock-watching.","Return to bed when drowsiness returns."],"tags":["insomnia","wake at night"],"flags":["nohold","nocount"]},{"id":"warm-shower-earlier","name":"Warm shower earlier","category":"Routine","min":10,"evidence":"limited","summary":"Comforting routine when time permits.","steps":["Take a comfortably warm shower well before bed if it suits you.","Keep the experience relaxing rather than hot or lengthy.","Finish with low stimulation and normal room temperature."],"tags":["body","routine"],"flags":["nohold","nocount"]},{"id":"evening-light-taper","name":"Evening light taper","category":"Routine","min":8,"evidence":"supported","summary":"Shift from bright room lighting to gentler cues.","steps":["Lower the brightest lights about an hour before bed when practical.","Favor dim, warm lamps over harsh overhead light.","Keep walking routes safe; do not make your home dangerously dark."],"tags":["light","routine"],"flags":["nohold","nocount"]},{"id":"after-night-waking-reset","name":"After-night-waking reset","category":"Routine","min":6,"evidence":"guideline","summary":"Respond gently to waking up during the night.","steps":["Keep lights dim and avoid checking the time repeatedly.","If calm, remain comfortable and let sleep return naturally.","If frustrated and fully awake, take a short boring break out of bed."],"tags":["wake at night","insomnia"],"flags":["nohold","nocount","nd"]},{"id":"room-noise-audit","name":"Room-noise audit","category":"Routine","min":4,"evidence":"preference","summary":"Identify one controllable disturbance, if any.","steps":["Listen for a recurring noise that actually wakes you.","Close a door, adjust fan or mask the sound gently if helpful.","Stop optimizing once the room feels good enough."],"tags":["sound","environment"],"flags":["nohold","nocount"]},{"id":"soft-landing","name":"Soft landing","category":"Routine","min":6,"evidence":"preference","summary":"A non-perfectionist transition from busy day to bed.","steps":["Silence anything demanding attention.","Make one small comfort adjustment.","Choose either quiet breathing, a story or nothing at all."],"tags":["ADHD","routine"],"flags":["nohold","nocount","nd"]},{"id":"permission-to-rest","name":"Permission to rest","category":"Hypnosis","min":12,"evidence":"limited","summary":"A gentle suggestion-based session without demanding sleep.","steps":["Choose a comfortable position and lower the lights.","Listen to the narrator invite relaxation and less effort.","Let words drift past; stop any suggestion you dislike."],"tags":["hypnosis","anxiety"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"deepening-staircase","name":"Deepening staircase","category":"Hypnosis","min":15,"evidence":"limited","summary":"A fictional countdown toward quiet rest.","steps":["Picture or simply hear about a staircase in soft light.","With each step, allow the body to settle without forcing it.","Stop counting whenever you want; the end is unimportant."],"tags":["hypnosis","imagery"],"flags":["nohold","eyesclosed"]},{"id":"quiet-forest-shelter","name":"Quiet forest shelter","category":"Hypnosis","min":14,"evidence":"limited","summary":"An original gentle story with grounding suggestions.","steps":["Hear the setting described without trying to see it.","Notice imaginary shelter, warmth and steady sounds.","Let the story become distant as attention loosens."],"tags":["hypnosis","story"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"cloud-room-drift","name":"Cloud-room drift","category":"Hypnosis","min":12,"evidence":"limited","summary":"Soft abstract sensory imagery for sleep.","steps":["Imagine a spacious, softly lit room.","Imagine the lights dimming and the floor supporting you.","Allow the scene to dissolve into gentle darkness."],"tags":["hypnosis","imagery"],"flags":["nohold","nocount","eyesclosed"]},{"id":"sleepy-train-story","name":"Sleepy train story","category":"Hypnosis","min":16,"evidence":"limited","summary":"Narrative hypnosis-style focus without hidden messages.","steps":["Listen to the details of a calm fictional train.","Notice how repetitive sounds and safe surroundings feel.","Allow the story to continue without following every sentence."],"tags":["hypnosis","story"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"body-heaviness-induction","name":"Body heaviness induction","category":"Hypnosis","min":12,"evidence":"limited","summary":"Verbal suggestions for releasing muscular effort.","steps":["Let the narrator guide awareness from feet to face.","Interpret “heavy” as supported, not forced or paralyzed.","Keep breathing naturally and skip uncomfortable suggestions."],"tags":["hypnosis","body"],"flags":["nohold","nocount","eyesclosed"]},{"id":"no-imagery-hypnosis","name":"No-imagery hypnosis","category":"Hypnosis","min":12,"evidence":"limited","summary":"Induction centered on language and touch instead of visualization.","steps":["Find an actual physical point of comfort.","Listen to permission-based suggestions without picturing anything.","Let narration fade into ordinary background sound."],"tags":["hypnosis","aphantasia","ADHD"],"flags":["nohold","nocount","eyesclosed","nd"]},{"id":"floating-shoreline","name":"Floating shoreline","category":"Hypnosis","min":15,"evidence":"limited","summary":"A gently repetitive shoreline sleep story.","steps":["Picture or just listen to a mild evening shoreline.","Use the returning wave rhythm as an optional anchor.","Allow scenes and thoughts to drift without trying to steer them."],"tags":["hypnosis","story"],"flags":["nohold","nocount","eyesclosed"]}];</script><script>const TRACKS = [
{id:'permission',name:'Permission to Rest',emoji:'🌙',kind:'Soft hypnosis',min:10,desc:'No countdown, no pressure. Just suggestions that leave you in control.',script:`Welcome. You do not need to do anything perfectly tonight. You do not need to breathe in a particular way, or find a special state of mind. You can listen to these words, or you can let them become distant sounds. Either choice is fine. Take a moment to notice the surface holding you. The mattress is doing the work. Your arms can simply be here. Your legs can simply be here. Each ordinary breath is enough. There may still be thoughts passing through. You do not have to make them disappear. A thought can be present without asking you to solve it. Imagine that a page has been turned over, and tomorrow is written on the other side. You do not need to read it now. For this little while there is no deadline and no task to finish. Perhaps the muscles around your eyes soften just a little. Perhaps your shoulders settle one millimeter. Perhaps nothing changes at all, and that is fine. Rest does not have to be earned. The night has room for you exactly as you are. If a sentence feels useful, keep it. If it does not, let it pass. There is nothing you need to remember. There is nothing to get right. You may notice the edge of the blanket, the weight of your body, a sound outside. Everything can be allowed to exist without becoming a problem to solve. Sometimes attention moves closer. Sometimes it wanders far away. You can let it wander. The next thing can wait. The last thing is already done. And in the middle, there is this ordinary, quiet moment. You are allowed to stop trying. You are allowed to rest.`},
{id:'train',name:'The Night Train',emoji:'🚆',kind:'Sleep story',min:16,desc:'A gentle fictional train rolling through a quiet night.',script:`Imagine, or simply listen to the description of, a small train traveling through the evening. The carriage is warm, the seats are soft, and no one expects you to speak. Outside, the countryside is dark and peaceful. A light appears in the distance, then passes out of view. The train moves with a slow, familiar rhythm. You have already found your seat. Your bag is safely put away. There are no tickets to check. There is no station you need to recognize. This is a journey with nothing to organize. You feel the seat supporting your back. Beyond the glass, the horizon is only a soft shade of blue-black. Rain sometimes touches the window and slides down in a thin line. You do not need to count the drops. Somewhere down the carriage a lamp gives a warm glow. The floor is still beneath your feet, even as the train moves. Nothing surprising happens here. A field goes by. A row of dark trees goes by. A tiny house with one gentle light goes by. Everything is passing without demanding your attention. You can let each scene arrive and leave. A bend in the track makes the movement slightly different, then everything returns to its easy rhythm. No need to imagine these details clearly. Words can be enough. You can enjoy a feeling without making a picture of it. There is another curve, and the train moves onward. If thoughts come along for the ride, they may sit quietly in another seat. You do not have to entertain them. Your only job is no job at all. The carriage lights gradually grow dimmer. The landscape grows softer. A quiet stretch of track takes the train into a wide, restful night. You may keep listening, or drift away whenever you like.`},
{id:'forest',name:'Forest Shelter',emoji:'🌲',kind:'Sleep story',min:14,desc:'A quiet woodland cabin, warm fabric and distant rainfall.',script:`There is a little shelter at the edge of an imaginary forest. It is early evening, and the path to the shelter is clear. No one is in a hurry. Inside, there is a simple comfortable chair, a folded blanket, and a window facing the trees. You are free to choose the details. Maybe the chair is soft, maybe the blanket is light, maybe you prefer to stay in bed and simply hear these words. A gentle rain begins far away. It comes closer, not suddenly, just a familiar patter on the roof. The roof keeps the room dry. The room is quiet enough to notice the sound of the rain without needing to follow it. One branch moves slowly beyond the window. The air feels cool and comfortable. There is no story to finish and nothing hidden in the woods. It is simply a place where nothing is required. In this space, your arms and shoulders can be unbusy. The little thoughts of the day are like leaves carried along a stream. A leaf comes into view, moves past, and keeps going. You do not have to pick it up. Another thought can float past in the same way. Somewhere the rain becomes softer. The light inside the shelter turns warmer and dimmer. If you cannot picture the room, that is fine. You can notice the real blanket around you, the actual weight of the bed beneath you. Reality can be your anchor. Everything beyond this moment can wait until daylight. The imagined forest remains quiet. The rain may continue without you listening to every drop. You can rest, and the story will take care of itself.`},
{id:'body',name:'A Softer Body',emoji:'🫧',kind:'Body induction',min:12,desc:'A gentle supported-body scan, with no required imagery.',script:`You can allow your eyes to close if you wish. You can also keep them open and soften your gaze. Notice your feet. There may be warmth, coolness, pressure, or nothing remarkable at all. All of that is acceptable. Your feet do not need to work right now. The bed can support them. Move attention slowly to the calves. There is no need to tense or stretch. Simply notice what is there. Maybe you can let one small area feel more supported. Now the knees, the thighs, and the hips. Your body has carried you through today. For this time, it can be carried. Notice the back touching the surface beneath you. There is no perfect position. If you need to adjust, adjust. Comfort is more important than being perfectly still. Your hands can rest. Your fingers can unclench if they want to. Your shoulders can drop just a little. Nothing dramatic is needed. Notice the neck and the jaw. Your teeth can part slightly, and your forehead can stay smooth. Now feel the weight of your whole body, without trying to make it heavier. The surface beneath you is steady. Your breathing happens by itself. You do not need to slow it, deepen it, or control it. If you become distracted, you have not failed. You may pick up the gentle scan anywhere. Or you may stop following the words entirely. Rest is possible without performing a technique. For a while, you can be exactly where you are.`},
{id:'cloud',name:'Cloud Room',emoji:'☁️',kind:'Abstract hypnosis',min:12,desc:'Soft, unstructured imagery with dissolving details.',script:`Imagine a room that does not need a clear shape. It might have soft walls or no visible walls at all. There is room to stretch. There is room to breathe in an ordinary way. A dim glow rests in one corner, like the last light of evening. Nothing in this place needs arranging. You do not need to choose furniture, colors or doors. You may simply hear the description and let it pass. At the center of this room is a place to rest. It supports you without asking for effort. The light is gentle. It does not flicker or change suddenly. Somewhere in the distance, a quiet sound repeats. The room becomes a little softer around the edges. It is fine if the image changes. It is fine if you cannot see it at all. You are allowed to let the words replace the pictures. There is no test of visualization here. As the imagined light slowly dims, your attention can become less focused. The room may seem farther away. It may disappear entirely. You can notice your actual pillow, your actual blanket, your actual breathing. These ordinary sensations are enough. If your mind wants to return to the room, it can. If it wants to drift elsewhere, that is fine too. The glow becomes smaller. The last outline of the room fades into a comfortable darkness. The room has done its job without you needing to finish the story.`},
{id:'shore',name:'The Quiet Shore',emoji:'🌊',kind:'Sleep story',min:15,desc:'Slow imagined waves and easy rhythm.',script:`Think of a calm shoreline in the late evening. You do not need to be on the beach. You may be resting somewhere comfortably nearby, hearing the water from a safe distance. The air is mild. The sky is dim and calm. Small waves move toward the shore, then move back. One gentle movement after another. The pattern repeats, but never needs counting. The water is not asking you to watch. The shore is not asking you to walk. You may simply be here. A pale ribbon of foam appears, spreads for a moment, then disappears. Another arrives in its own time. Your breathing can have its own natural pace. There is no need to match it to the waves. Everything is free to move independently. The horizon remains broad and quiet. A breeze touches the dune grass, and then the grass becomes still. There is no destination tonight. The tide knows how to continue without anyone supervising it. In the same way, your body knows how to rest without instructions for every moment. A thought can appear like a small shell on the sand. You can notice it, then leave it there. Another wave comes and goes. You may not hear the rest of the story, and that is perfectly fine. Let the imaginary shoreline continue, whether or not you pay attention. It will be there without you having to hold it in mind.`},
{id:'staircase',name:'The Soft Staircase',emoji:'🪜',kind:'Counting induction',min:13,desc:'A gentle countdown with an easy escape from counting.',script:`Imagine a broad staircase with shallow steps and a handrail. It is part of a quiet, comfortable place. There is no pressure to reach the bottom. You may simply imagine the idea of descending, or listen to the numbers as they pass. Ten. One little permission to soften your shoulders. Nine. One little permission to release the day. Eight. There is no hurry. Seven. Your hands may rest comfortably. Six. The light around the staircase is warm and low. Five. You can stop counting whenever you like. Four. There is no important number to remember. Three. You are safe to remain exactly where you are. Two. Nothing more to do. One. And perhaps the staircase continues, or perhaps it becomes a cloud, or simply disappears. If your attention has wandered elsewhere, no return trip is needed. You can rest right there. There is no prize at the end of this exercise. The quiet place around you can change without warning or purpose, but always gently. A doorway may open onto another still room. Or you may stay exactly where you are. Breathing can take care of itself. Muscles can take care of themselves. You do not need to find a deeper state, because there is no state you must achieve. A soft staircase is only a little idea, a way to release the need to do anything else.`},
{id:'no-image',name:'No Pictures Needed',emoji:'🪶',kind:'Aphantasia-friendly',min:12,desc:'No visualization needed: focus on physical sensation and language.',script:`This session does not ask you to see a single picture. You do not need an inner movie, or to imagine a place. You can be exactly as you are. Notice the touch of the bedding on one part of your skin. You might notice the temperature, texture or weight. You do not need to name it correctly. A simple sensation is enough. Perhaps there is a sound in the room. It can be near or far, steady or occasional. You can allow it to belong to the room without needing to investigate it. Listen to one sentence, and then let it go. There is no reason to keep a memory of my words. The next sentence arrives in its own time. Your body is here. The room is here. The future is not requiring your attention right now. If a thought appears, you do not have to win against it. You can let it move through your awareness while you continue resting. The mattress is underneath you. The next breath will come by itself. You can choose a single point of touch to return to, or no anchor at all. This is not a task to complete. You are allowed to be awake without being busy. You are allowed to become sleepy without noticing when it happens.`},
{id:'lantern',name:'Lantern Library',emoji:'📚',kind:'ADHD-friendly story',min:14,desc:'An unusual but quiet story that doesn’t require following a plot.',script:`There is a small library open at night. It has no closing time, no assignments, no fines, and no one waiting for a reply. The shelves are made of dark wood, and a few gentle lamps glow between them. You find a chair that fits just right. A book rests on a nearby table. You do not need to read it. The cover says only: tomorrow can wait. Another book has an ordinary title about clouds. A third is about tiny houses. You could choose a book, but you do not need to decide. The librarian is busy doing nothing important. Pages turn somewhere in the room. The sound is quiet and predictable. One shelf holds small jars of imaginary weather: a little rain, a cool breeze, a patch of blue sky. Each one is safely closed. You can simply notice the idea of them. The lamps glow softly and do not flicker. No detail is essential. This is not a mystery to solve. It is a collection of small, harmless observations. The room is calm. The chair is comfortable. A distant clock is silent. If your mind wants to wander, there are many ordinary details it can borrow. A folded map. A wooden drawer. A stack of blank pages. Or your attention can leave the library entirely. The story will not mind. You have no book to finish. Nothing is due. You can let the room drift away in the quiet.`},
{id:'midnight',name:'Midnight Reset',emoji:'✨',kind:'Racing-thoughts relief',min:9,desc:'For overstimulated nights and mental loops.',script:`Your mind might be busy. It might be moving from one idea to another so quickly that there is no obvious pause. You do not need to fight that. For a moment, imagine that you are allowed to close all the open tabs without losing anything important. Each thought can be saved for tomorrow. You do not need to close your eyes to do this. You do not need to be calm already. Start with the feeling of the bed beneath one hand. Notice that it stays there even when your mind is fast. Now give the next thought a simple name: planning, replaying, predicting, or remembering. You do not need to decide whether the thought is right. You can say, quietly, not tonight. Let the next thought pass through, too. There may be dozens of them. That is not a failure. You can stop sorting at any time. Try a soft sentence: resting is enough for now. Nothing more complicated. The mind may continue to chatter for a while. You can let it make background noise without turning to face it. There is nothing you must solve in the next few minutes. The night is allowed to be ordinary. You are allowed to be ordinary within it. Let the next word come, and then let it disappear. The next thing you notice might be sleep, or it might be another quiet moment. Both are acceptable.`},
{id:'rain-story',name:'Rain on the Window',emoji:'🌧️',kind:'Soft narration',min:12,desc:'Steady repetition and a warm, quiet setting.',script:`A gentle rain falls on a window somewhere. Not a storm, and not a sudden shower. Just small drops arriving at their own pace. Inside, the room is warm enough and quiet enough. There is a comfortable place to rest. The window is closed and the rain stays outside. One drop moves slowly down the glass. It meets another, and they continue together. You do not need to watch them all the way. Another drop takes a different path. The patterns are too ordinary to memorize. The sound goes on, neither exciting nor demanding. Nothing needs to happen next. There may be a blanket. There may be a dim lamp in another room. There may be nothing but soft darkness and the sound of rain. Any of those details can be enough. Your mind can draw a picture or not. You can rest with the words, or move far away from the words. The rain will carry on without your participation. A small breath comes and goes. Another follows. Perhaps your hands are warm. Perhaps your feet are cool. You can adjust your comfort whenever you want. There is no rule about being still. The drops continue their quiet patterns against the glass. They do not have to be understood. They only have to be allowed to be rain.`},
{id:'dk-ro',name:'Ro uden pres',emoji:'🌘',kind:'Dansk hypnose',min:10,desc:'Dansk, blid guidet afspænding uden krav om visualisering.',lang:'da-DK',script:`Velkommen. Du behøver ikke gøre noget bestemt lige nu. Du skal ikke falde i søvn på kommando. Du kan bare lytte lidt, og lade ordene glide forbi. Mærk underlaget, der støtter kroppen. Din seng gør arbejdet for dig. Du behøver ikke spænde musklerne eller holde vejret. Træk vejret helt naturligt. Hvis tankerne kommer, må de gerne være der. Du behøver ikke løse dem i nat. Forestil dig, at morgendagens opgaver allerede står skrevet et sikkert sted. Du kan se på dem i morgen. Lige nu kan du give dig selv lov til bare at hvile. Måske kan kæben slappe en lille smule af. Måske kan skuldrene sænke sig. Det er også helt fint, hvis du ikke mærker nogen forskel. Du skal ikke præstere afslapning. Bemærk dynen, puden eller madrassen. Det er nok at være her. En tanke kan komme og gå, uden at du behøver følge med. Du kan lade opmærksomheden flyde, som den vil. Her er ingen prøve, du skal bestå. Du kan være vågen og hvile samtidig. Og søvnen må komme, når den kommer. Indtil da er der ingenting, du behøver at gøre.`}
];

const PALETTES={violet:{bg:'#080b16',panel:'#101629',panel2:'#161d33',accent:'#b1a6fb',accent2:'#80d9d0',glow:'rgba(129,106,234,.15)'},amber:{bg:'#100b0c',panel:'#211617',panel2:'#2c1e1c',accent:'#efb58f',accent2:'#f1cd8f',glow:'rgba(210,106,72,.16)'},forest:{bg:'#081110',panel:'#12201d',panel2:'#1a2b26',accent:'#99c6ae',accent2:'#a5cbbc',glow:'rgba(84,170,130,.13)'},rose:{bg:'#150e18',panel:'#281b2b',panel2:'#322038',accent:'#e0b0cc',accent2:'#ead1b7',glow:'rgba(198,108,162,.16)'},oled:{bg:'#000000',panel:'#0c0c11',panel2:'#16161c',accent:'#b6afd1',accent2:'#b0c5c1',glow:'rgba(90,90,110,.07)'},deepblue:{bg:'#060e18',panel:'#101c2a',panel2:'#17283a',accent:'#a6c4ea',accent2:'#9bcecc',glow:'rgba(58,108,192,.13)'}};
const SHUFFLE_WORDS=['horizon','teacup','lantern','pencil','pebble','meadow','envelope','window','pocket','dandelion','shelf','walnut','kettle','ribbon','postcard','puddle','fern','staircase','paperclip','shell','armchair','raincoat','moss','harbor','cushion','marble','bridge','tablecloth','lamp','notebook','bicycle','button','orchard','cupboard','island','clockwork','pillowcase','bookshop','suitcase','candle','umbrella','blanket','fountain','teaspoon','lighthouse','glove','courtyard','cedar','pavement','carousel'];
const JUMP={wired:'easy-4-6-breathing',thoughts:'cognitive-shuffle',body:'no-tension-body-scan',pressure:'paradoxical-intention',awake:'stimulus-control',sensory:'minimal-input-mode'};
const getMethod=id=>METHODS.find(m=>m.id===id);
const formatTime=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}`;
function save(){try{localStorage.setItem('somna-config-v1',JSON.stringify(cfg))}catch{}}
function toast(msg){const n=$('#toast');n.textContent=msg;n.hidden=false;clearTimeout(toast.id);toast.id=setTimeout(()=>n.hidden=true,2800)}
function theme(){const p=PALETTES[cfg.theme]||PALETTES.violet;Object.keys(p).forEach(k=>document.documentElement.style.setProperty('--'+k,p[k]));document.documentElement.style.setProperty('--fontscale',cfg.large?'1.13':'1');document.documentElement.style.setProperty('--dim',cfg.quiet?'.18':'.03');document.body.classList.toggle('nightmode',cfg.night)}
function header(){return `<header class="top"><div class="brand"><div class="logo" aria-hidden="true">☾</div><div>SOMNA<small>THE SLEEP STUDIO</small></div></div><div class="top-actions"><span class="soft-pill">✦ Made for slower nights</span><button class="icon-btn" data-act="night" aria-label="Toggle dark sleep screen" title="Night focus">◐</button><button class="icon-btn" data-act="go" data-page="settings" aria-label="Settings">⚙</button></div></header>`}
function nav(){const items=[['home','⌂','Tonight'],['library','▦','Explore'],['studio','◎','Studio'],['audio','♫','Audio'],['lab','✧','Tools']];return `<nav class="tabnav" aria-label="Main navigation">${items.map(([id,ico,name])=>`<button class="navbtn ${state.page===id?'active':''}" data-act="go" data-page="${id}" aria-current="${state.page===id?'page':'false'}"><span class="i">${ico}</span><span>${name}</span></button>`).join('')}</nav>`}
function sectionTitle(k,t,sub='',right=''){return `<div class="section-head"><div><div class="eyebrow">${k}</div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`}
function methodCard(m){return `<div class="method" role="button" tabindex="0" data-act="method" data-id="${m.id}"><div class="glyph">${ICON[m.category]||'☾'}</div><div class="method-content"><h3>${esc(m.name)}</h3><p>${esc(m.summary)}</p><div class="meta"><span>◷ ${m.min} min</span><span>${esc(EVIDENCE[m.evidence])}</span>${m.flags.includes('nd')?'<span>✦ ND-friendly</span>':''}</div></div><button class="fav ${cfg.favorite.includes(m.id)?'on':''}" data-act="fav" data-id="${m.id}" aria-label="Toggle favorite">${cfg.favorite.includes(m.id)?'★':'☆'}</button></div>`}
function startFor(m){startSession(m.id)}
function renderHome(){const quick=[['wired','⚡','Overstimulated','Ease out of high alert'],['thoughts','🌀','Racing thoughts','Give the mind something easy'],['body','🫧','Body won’t settle','Release tension without effort'],['pressure','🪶','Trying too hard','Let go of sleep pressure'],['awake','🌒','Wide awake','Try a gentle reset'],['sensory','🎧','Sensory overload','Less light, fewer inputs']];const picks=['cognitive-shuffle','easy-4-6-breathing','progressive-muscle-relaxation','permission-to-rest'];return `<div class="view">${sectionTitle('Your evening, your pace','Welcome to quieter nights','No scores to chase. Pick what you need, then let the screen go.')}<div class="layout"><div class="stack"><section class="hero"><span class="eyebrow">✦ Your personalized wind-down</span><h1>There is nothing<br>to <span style="color:#cec2ff">force.</span></h1><p>A calm space for restless minds. Guided breathing, gentle hypnosis, soothing sound, and 88 practical methods—without turning sleep into a performance.</p><div class="hero-actions"><button class="btn primary" data-act="start" data-id="cognitive-shuffle">☾ Start a gentle reset</button><button class="btn ghost" data-act="go" data-page="audio">♫ Listen instead</button></div></section>${sectionTitle('Fast access','How does your mind feel?','Choose one. There is no need to browse everything.')}<div class="grid2">${quick.map(([id,icon,title,sub])=>`<button class="tile" data-act="quick" data-id="${id}"><span class="emoji">${icon}</span><b>${title}</b><span>${sub}</span></button>`).join('')}</div></div><div class="stack"><div class="panel"><div class="row between"><span class="eyebrow">Tonight's suggestion</span><span class="pill evidence">Low pressure</span></div><div class="center" style="padding:24px 0 19px"><div class="mini-orb" style="margin:auto"></div><h3 style="margin:20px 0 7px;font-size:20px">You don't have to visualize.</h3><p class="muted small" style="line-height:1.7">Sound, words, touch, or silence all count. Choose the channel that feels easiest tonight.</p></div><button class="btn w100" data-act="start" data-id="no-visualization-option">Try the no-imagery guide ↗</button></div><div class="panel"><span class="eyebrow">The collection</span><div class="grid3 mt16"><div class="metric"><b>${METHODS.length}</b><span>methods</span></div><div class="metric"><b>${TRACKS.length}</b><span>voice journeys</span></div><div class="metric"><b>${Object.keys(PRESETS).length}</b><span>soundscapes</span></div></div><button class="btn ghost w100 mt16" data-act="go" data-page="library">Explore all methods</button></div><div class="night-card"><div class="night-glyph">🛏️</div><div><b>Persistent insomnia?</b><p>CBT-I is the best-supported first-line treatment. These in-app techniques can complement it, not replace care.</p></div></div></div></div>${sectionTitle('Selected for you','A good place to begin','Short, low-demand techniques.','<button class="tiny-link" data-act="go" data-page="library">All techniques ↗</button>')}<div class="method-grid">${picks.map(id=>methodCard(getMethod(id))).join('')}</div></div>`}
function filteredMethods(){let a=METHODS.filter(m=>state.category==='All'||m.category===state.category);if(state.search.trim()){const q=state.search.toLowerCase().trim();a=a.filter(m=>[m.name,m.summary,m.category,...m.tags,...m.steps].join(' ').toLowerCase().includes(q))}if(state.maxMinutes<99)a=a.filter(m=>m.min<=state.maxMinutes);if(state.evidence!=='all')a=a.filter(m=>m.evidence===state.evidence);if(state.flags.length)a=a.filter(m=>state.flags.every(f=>m.flags.includes(f)));if(state.filterFavorites)a=a.filter(m=>cfg.favorite.includes(m.id));if(state.sort==='fast')a.sort((a,b)=>a.min-b.min);if(state.sort==='long')a.sort((a,b)=>b.min-a.min);if(state.sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name));if(state.sort==='evidence'){const order=['guideline','supported','limited','preference'];a.sort((a,b)=>order.indexOf(a.evidence)-order.indexOf(b.evidence))}return a}
function results(){const a=filteredMethods();return `<div class="row between" style="margin:3px 0 13px"><span class="muted small">${a.length} techniques found</span><span class="soft xs">Evidence labels are not efficacy guarantees</span></div><div class="method-grid">${a.length?a.map(methodCard).join(''):`<div class="panel center"><h3>No matching methods</h3><p class="muted small">Try clearing filters or searching a different word.</p><button class="btn" data-act="reset-filters">Clear filters</button></div>`}</div>`}
function renderLibrary(){return `<div class="view">${sectionTitle('Technique atlas','Find your way to rest','Filter by timing, sensory needs, evidence and the kind of attention that feels easiest.')}<div class="search"><label for="query">⌕</label><input id="query" type="search" placeholder="Search 88 methods, symptoms or techniques…" value="${esc(state.search)}" autocomplete="off" aria-label="Search methods"/><span class="pill">${METHODS.length}</span></div><div class="filters">${CATEGORIES.map(c=>`<button class="chip ${state.category===c?'active':''}" data-act="cat" data-cat="${c}">${c==='All'?'✦ ':ICON[c]+' '}${c}</button>`).join('')}</div><div class="panel" style="padding:13px 16px;margin:13px 0"><div class="toolbar"><div class="row wrap"><select id="time-filter" class="select-inline" aria-label="Maximum duration">${[99,2,5,10,15,20].map(n=>`<option value="${n}" ${n===state.maxMinutes?'selected':''}>${n===99?'Any duration':'≤ '+n+' minutes'}</option>`).join('')}</select><select id="evidence-filter" class="select-inline" aria-label="Evidence category">${[['all','Any evidence'],['guideline','Guideline-based'],['supported','Research-supported'],['limited','Limited evidence'],['preference','Preference tools']].map(([v,n])=>`<option value="${v}" ${v===state.evidence?'selected':''}>${n}</option>`).join('')}</select><select id="sort-filter" class="select-inline" aria-label="Sort methods">${[['relevance','Collection order'],['fast','Shortest first'],['long','Longest first'],['name','A–Z'],['evidence','Evidence first']].map(([v,n])=>`<option value="${v}" ${v===state.sort?'selected':''}>${n}</option>`).join('')}</select></div><button class="btn tiny ghost" data-act="reset-filters">Reset</button></div><div class="filters" style="margin-bottom:0">${[['nd','ND-friendly'],['nohold','No breath holds'],['nocount','No counting'],['eyesclosed','Eyes closed']].map(([f,n])=>`<button class="chip ${state.flags.includes(f)?'active':''}" data-act="flag" data-flag="${f}">${n}</button>`).join('')}<button class="chip ${state.filterFavorites?'active':''}" data-act="only-fav">★ Favorites</button></div></div><div id="method-results">${results()}</div></div>`}
function sessionMarkup(){const s=state.session;const active=s?.active;const cur=active?getMethod(s.method):null;return `<div class="panel session-stage"><div class="eyebrow">${active?'GUIDED SESSION':'YOUR REST SPACE'}</div><div class="orb-halo" aria-hidden="true"></div><div id="orb" class="breath-orb ${cfg.reduced?'reduce':''}" aria-hidden="true" style="margin:36px 0 31px"><span id="orb-label">${active?cur.category==='Breath'?'Breathe':'Rest':'Breathe'}</span></div><div class="big-time" id="timer-number">${active?formatTime(s.duration-s.elapsed):'00:00'}</div><div class="soft xs" id="timer-caption">${active?`Remaining · ${esc(cur.name)}`:'Start whenever you feel ready'}</div><h3 class="step-title" id="session-step-title">${active?esc(cur.name):'A place to slow down'}</h3><div class="step-text" id="session-step-text">${active?esc(cur.steps[0]):'Choose a technique or a preset. Nothing will play without a tap.'}</div><div class="stepdots" id="stepdots"></div><div class="session-actions">${active?`<button class="btn ghost" data-act="session-stop">■ End</button><button class="btn primary" id="pause-btn" data-act="session-pause">${s.paused?'▶ Continue':'Ⅱ Pause'}</button><button class="btn ghost" data-act="step-next">Next ↗</button>`:`<button class="btn primary" data-act="start" data-id="easy-4-6-breathing">▶ Start 4–6 breathing</button>`}</div>${cfg.night?'<button class="btn tiny ghost mt16" data-act="night">Exit dark focus</button>':''}</div>`}
function renderStudio(){const s=state.session;return `<div class="view">${!cfg.night?sectionTitle('Guided studio','Your sleep session','A guided timer that asks nothing of you once started.'):''}<div class="studio-grid"><div>${sessionMarkup()}<div class="night-card mt16"><div class="night-glyph">☾</div><div><b>You can stop any time</b><p>Breathing is always gentle. Don’t hold your breath or continue a pattern that feels uncomfortable.</p></div></div></div><div class="stack">${cfg.night?'':`<div class="panel"><div class="row between"><b class="subheading">Quick presets</b><span class="pill">One tap</span></div><div class="stack mt16" style="gap:9px">${[['easy-4-6-breathing','〰️','Breathe softly','4 min'],['cognitive-shuffle','🧠','Busy mind reset','10 min'],['no-tension-body-scan','🫧','Rest the body','10 min'],['paradoxical-intention','🪶','No-pressure mode','8 min'],['stimulus-control','🛏️','Awake at night','10 min']].map(([id,emo,label,min])=>`<button class="night-card" style="color:var(--text);text-align:left;cursor:pointer" data-act="start" data-id="${id}"><div class="night-glyph">${emo}</div><div class="grow"><b>${label}</b><p>${min} · tap to begin</p></div><span>↗</span></button>`).join('')}</div></div><div class="panel"><div class="row between"><b class="subheading">Custom sleep stack</b><span class="pill">${cfg.stack.length} saved</span></div><p class="muted small">Build a short sequence from library cards. Sessions switch automatically; no interaction required.</p>${cfg.stack.length?`<div class="stack mt12" style="gap:8px">${cfg.stack.map((id,i)=>{const m=getMethod(id);return m?`<div class="night-card"><span class="pill">${i+1}</span><div class="grow"><b>${esc(m.name)}</b><p>${m.min} min</p></div><button class="muted-button" data-act="stack-remove" data-id="${id}" aria-label="Remove">✕</button></div>`:''}).join('')}</div><button class="btn primary w100 mt16" data-act="stack-start">▶ Run sleep stack (${cfg.stack.reduce((n,id)=>n+(getMethod(id)?.min||0),0)} min)</button><button class="btn ghost tiny w100 mt12" data-act="stack-clear">Clear stack</button>`:`<div class="captionbox">Your stack is empty. Visit Explore, open a method and tap “Add to stack”.</div>`}<button class="btn ghost w100 mt12" data-act="go" data-page="library">Browse methods ↗</button></div>`}<div class="panel"><b class="subheading">Bedside controls</b>${toggleRow('Night focus','Hide navigation and reduce visual clutter','night',cfg.night)}${toggleRow('Reduced motion','No floating or pulsing animations','reduced',cfg.reduced)}${toggleRow('Dimmed interface','Darken the UI further','quiet',cfg.quiet)}</div></div></div></div>`}
function trackCard(t){const words=t.script.trim().split(/\s+/).length;const estimated=Math.max(2,Math.ceil(words/(135*cfg.voiceRate)*cfg.voiceLoops + (t.script.match(/[.!?]/g)||[]).length*.014*cfg.voiceLoops));return `<div class="track-card"><div class="cover">${t.emoji}</div><div class="grow"><h3>${esc(t.name)}</h3><p>${esc(t.kind)} · ≈${estimated} min narration</p><p style="margin-top:4px">${esc(t.desc)}</p></div><button class="play" data-act="track" data-id="${t.id}" aria-label="Play ${esc(t.name)}">▶</button></div>`}
function renderAudio(){return `<div class="view">${sectionTitle('Sound + suggestion','The audio sanctuary','Layer gentle soundscapes or listen to original device-voiced hypnosis-style sessions.')}<div class="layout"><div class="stack"><div class="panel"><div class="row between"><div><div class="eyebrow">Live sound engine</div><h2 style="margin:7px 0 0">Soundscape mixer</h2></div><button class="big-play" data-act="sound-play" aria-label="Toggle soundscape" id="sound-play">${state.soundPlaying?'Ⅱ':'▶'}</button></div><div id="soundviz" class="sound-visual ${state.soundPlaying?'':'paused'}" aria-hidden="true">${Array.from({length:32},(_,i)=>`<span style="--dur:${(1.1+(i%7)*.28).toFixed(2)}s;--h:${(20+((i*23)%64))}% ;animation-delay:${-i*.18}s"></span>`).join('')}</div><div class="row between"><b id="sound-title">${esc(state.soundPreset)}</b><span class="pill">Procedural · no streaming</span></div><div class="control-row"><div class="grow"><span>Master volume</span><small>Keep it gentle, especially with headphones.</small></div><div style="width:50%"><input type="range" id="audioMaster" min="0" max=".6" step=".01" value="${cfg.audioMaster}" aria-label="Master volume"></div></div><div class="control-row"><div class="grow"><span>Auto fade / stop</span><small>Timer only runs while sound is playing.</small></div><select id="fade-select" class="select-inline">${[0,5,10,15,20,30,45,60,90].map(n=>`<option value="${n}" ${n===cfg.soundFade?'selected':''}>${n?n+' min':'Off'}</option>`).join('')}</select></div><div id="sound-sliders">${renderSliders()}</div></div>${sectionTitle('Ready-made mixes','Twelve sound environments','Tap a soundscape to load it. Use Play to start the sound engine.')}<div class="grid2">${Object.keys(PRESETS).map((p,i)=>`<button class="sound-card ${p===state.soundPreset?'selected':''}" data-act="preset" data-name="${esc(p)}"><span class="em">${SCENE_EMOJI[i]}</span><b>${esc(p)}</b><span>${p==='Silent room'?'No audio, just quiet':p==='Soft focus'?'Subtle low ambience':'Customizable ambient texture'}</span><div class="bar"><i style="width:${p===state.soundPreset?'85':'30'}%"></i></div></button>`).join('')}</div></div><div class="stack"><div class="panel"><div class="eyebrow">Voice journeys</div><h2 style="margin:9px 0 4px">Sleep hypnosis & stories</h2><p class="muted small" style="line-height:1.7">Original permission-based scripts, spoken by your iPhone's available system voices. No hidden suggestions. The voice is generated on your device; browser playback may pause when locked.</p><div class="stack mt16" style="gap:9px">${TRACKS.map(trackCard).join('')}</div></div><div class="panel"><b class="subheading">Narration settings</b><label class="mini-label" for="voice-select">Available voice</label><select id="voice-select" style="width:100%"><option value="">System default</option></select><div class="row between mt12"><span class="small muted">Narration speed</span><b id="rate-value">${cfg.voiceRate.toFixed(2)}×</b></div><input type="range" id="voiceRate" min=".6" max="1.2" step=".05" value="${cfg.voiceRate}" aria-label="Narration speed"><div class="row between"><span class="small muted">Voice volume</span><b id="voice-vol-value">${Math.round(cfg.voiceVol*100)}%</b></div><input type="range" id="voiceVol" min="0" max="1" step=".05" value="${cfg.voiceVol}" aria-label="Voice volume"><div class="control-row"><div class="grow"><span>Narration length</span><small>Repeat the original calming passage</small></div><select id="voice-loops" class="select-inline">${[1,2,3,4].map(n=>`<option value="${n}" ${cfg.voiceLoops===n?'selected':''}>${n}× loop</option>`).join('')}</select></div><div class="row mt12"><button class="btn ghost w100" data-act="voice-stop">■ Stop voice</button><button class="btn primary w100" data-act="voice-test">▶ Test voice</button></div><p class="muted xs" style="line-height:1.7">Some iOS voices require an internet download in iOS settings. Speaking needs the screen active on some devices.</p></div></div></div></div>`}
function renderSliders(){return Object.keys(SOUND_LABELS).map(k=>{const val=(soundLevels[k]||0);return `<div class="mix-row"><div class="mix-emoji">${SOUND_ICONS[k]}</div><div><div class="row between"><span class="small">${SOUND_LABELS[k]}</span><span id="level-${k}" class="soft xs">${Math.round(val*100)}%</span></div><input aria-label="${SOUND_LABELS[k]} level" data-sound="${k}" type="range" min="0" max="1" step=".01" value="${val}"></div><button class="icon-btn" data-act="solo-sound" data-key="${k}" aria-label="Solo ${SOUND_LABELS[k]}" style="width:37px;height:37px;font-size:11px">SOLO</button></div>`}).join('')}
function toggleRow(title,sub,key,val){return `<div class="control-row"><div class="grow"><span>${title}</span><small>${sub}</small></div><button class="toggle ${val?'on':''}" data-act="setting" data-key="${key}" role="switch" aria-checked="${val}"><span class="sr-only">Toggle ${title}</span></button></div>`}
function renderLab(){const tools=[['shuffle','🧠','Word shuffle','Give a busy mind harmless images'],['breath','〰️','Breath lab','Adjust the pace, no forced holds'],['parking','📓','Thought parking','Offload tomorrow’s thoughts'],['journal','🗒️','Sleep journal','Optional, not a sleep score'],['winddown','🌒','Bedtime builder','Make one small, repeatable ritual'],['night','🌑','Dark focus','Less light, less interaction'],['colors','🎨','Color lab','Choose your restful palette'],['discover','🔎','Method finder','Match a technique to your needs'],['voice','🗣️','Voice studio','Test and tune spoken guides']];return `<div class="view">${sectionTitle('Interactive toolkit','Sleep lab','Practical tools for different minds and different kinds of nights.')}<div class="tool-menu">${tools.map(([id,icon,label,sub])=>`<button class="tool" data-act="tool" data-id="${id}" style="border-color:${state.tool===id?'#b9a3ff91':'var(--border)'}"><span>${icon}</span><b>${label}</b><small>${sub}</small></button>`).join('')}</div><div class="panel mt16" id="tool-body">${renderToolBody()}</div></div>`}
function renderToolBody(){switch(state.tool){case 'shuffle':return `<div class="eyebrow">No memory test, no score</div><h2>Cognitive shuffle</h2><p class="muted small">Unrelated, ordinary words can give an active mind a low-stakes focus. Picture a word, feel its meaning, or simply hear it.</p><div class="word-card mt16" id="word">${esc(state.currentWord)}</div><div class="row mt16"><button class="btn primary grow" data-act="new-word">Next word →</button><button class="btn ghost" data-act="speak-word">♫ Speak word</button></div><p class="soft xs mt12">Tip: switch to eyes closed; don't force a mental image. This is an optional technique, not an established clinical treatment.</p>`;

omnia guideline (2021), NHS insomnia guidance, NCCIH mind-body review and reviews of sound stimulation and hypnotherapy. Tap References below for links.</p><button class="btn ghost w100" data-act="references">Read research references ↗</button></div><div class="panel"><b class="subheading">Important</b><p class="muted small" style="line-height:1.7">Hypnosis-style sessions are optional relaxation experiences, not medical hypnosis or treatment. Never use these while driving. Keep audio low. If insomnia persists, or breathing or sleep symptoms concern you, speak to a healthcare professional. Do not change prescribed medicines or restrict sleep based on this app.</p></div><div class="panel"><div class="row between"><b class="subheading">Offline-first edition</b><span class="pill good">No account</span></div><p class="soft xs">SOMNA 1.0 · 88 methods · ${TRACKS.length} original scripts · ${Object.keys(PRESETS).length} soundscapes</p></div></div></div></div>`}

function noiseBuffer(ctx,color){const l=Math.floor(ctx.sampleRate*3),b=ctx.createBuffer(1,l,ctx.sampleRate),d=b.getChannelData(0);let last=0, bb=[0,0,0,0,0,0,0];for(let i=0;i<l;i++){const r=Math.random()*2-1;if(color==='brown'){last=(last+.02*r)/1.02;d[i]=last*3.4}else if(color==='pink'){bb[0]=.99886*bb[0]+r*.0555179;bb[1]=.99332*bb[1]+r*.0750759;bb[2]=.96900*bb[2]+r*.153852;bb[3]=.86650*bb[3]+r*.3104856;bb[4]=.55000*bb[4]+r*.5329522;bb[5]=-.7616*bb[5]-r*.016898;d[i]=(bb[0]+bb[1]+bb[2]+bb[3]+bb[4]+bb[5]+bb[6]+r*.5362)*.11;bb[6]=r*.115926}else d[i]=r*.30}return b}
function createNoise(name,color,type,frequency,q=.7,mod=0){const c=SOUND.ctx,src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=noiseBuffer(c,color);src.loop=true;f.type=type;f.frequency.value=frequency;f.Q.value=q;g.gain.value=0;src.connect(f);f.connect(g);g.connect(SOUND.master);src.start();const n={src,gain:g};if(mod){const lfo=c.createOscillator(),lg=c.createGain();lfo.type='sine';lfo.frequency.value=mod;lg.gain.value=.11;lfo.connect(lg);lg.connect(g.gain);lfo.start();n.lfo=lfo}SOUND.nodes[name]=n}
function ensureSound(){if(SOUND.ctx)return true;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw new Error('AudioContext unavailable');const c=SOUND.ctx=new C();SOUND.master=c.createGain();SOUND.master.gain.value=cfg.audioMaster;SOUND.master.connect(c.destination);createNoise('brown','brown','lowpass',550);createNoise('pink','pink','lowpass',3500);createNoise('white','white','lowpass',4800);createNoise('rain','white','bandpass',1200,.3);createNoise('ocean','pink','lowpass',700,.6,.11);createNoise('wind','brown','bandpass',350,.38,.065);createNoise('fan','pink','bandpass',190,.8);createNoise('fire','white','lowpass',390,.6,.27);createNoise('river','white','bandpass',2200,.43,.24);const osc=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();osc.type='sine';osc.frequency.value=95;f.type='lowpass';f.frequency.value=150;g.gain.value=0;osc.connect(f);f.connect(g);g.connect(SOUND.master);osc.start();SOUND.nodes.hum={src:osc,gain:g};applySound();return true}catch(e){toast('Audio engine not available on this device. Try Safari.');return false}}
function applySound(){if(!SOUND.ctx)return;SOUND.master.gain.setTargetAtTime(cfg.audioMaster,SOUND.ctx.currentTime,.05);Object.entries(SOUND.nodes).forEach(([k,v])=>v.gain.gain.setTargetAtTime((soundLevels[k]||0)*.36,SOUND.ctx.currentTime,.13))}
