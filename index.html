function splitSpeech(text){const parts=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];const chunks=[];for(const p of parts){if(p.length<240)chunks.push(p.trim());else for(let i=0;i<p.length;i+=160)chunks.push(p.slice(i,i+160))}return chunks.filter(Boolean)}
function speak(text,lang='en-US'){if(!('speechSynthesis' in window)){toast('Voice narration is unavailable in this browser. Read the on-screen script instead.');return}stopVoice();const stamp=tts.stamp;tts.chunks=splitSpeech(text);tts.index=0;tts.lang=lang;tts.active=true;state.voicePlaying=true;function next(){if(stamp!==tts.stamp||!tts.active)return;if(tts.index>=tts.chunks.length){tts.active=false;state.voicePlaying=false;refreshPlayer();return}const u=new SpeechSynthesisUtterance(tts.chunks[tts.index++]);u.lang=lang;u.rate=cfg.voiceRate;u.pitch=cfg.voicePitch;u.volume=cfg.voiceVol;const arr=voices(),userV=arr[Number(cfg.voiceId)];if(cfg.voiceId!==''&&userV)u.voice=userV;else {const preferred=arr.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())&&/samantha|daniel|premium|enhanced|siri/i.test(v.name))||arr.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));if(preferred)u.voice=preferred}u.onend=()=>{tts.timeout=setTimeout(next,lang==='da-DK'?900:1050)};u.onerror=()=>{tts.timeout=setTimeout(next,250)};try{speechSynthesis.speak(u)}catch{toast('Speech did not start. Try another voice or browser.');stopVoice()}}next();refreshPlayer()}

function updateSessionDisplay(){const s=state.session;if(!s?.active)return;if(!s.paused)s.elapsed+=Math.max(0,(Date.now()-s.startedAt)/1000),s.startedAt=Date.now();if(s.elapsed>=s.duration){finishSession();return}const m=getMethod(s.method);const phase=Math.min(m.steps.length-1,Math.floor((s.elapsed/s.duration)*m.steps.length));const changed=phase!==s.phase;s.phase=phase;const t=$('#timer-number');if(t)t.textContent=formatTime(Math.ceil(s.duration-s.elapsed));const title=$('#session-step-title');if(title)title.textContent=m.name;const st=$('#session-step-text');if(st)st.textContent=m.steps[phase];const d=$('#stepdots');if(d)d.innerHTML=m.steps.map((_,i)=>`<b class="${i===phase?'active':''}"></b>`).join('');const orb=$('#orb'),ol=$('#orb-label');if(orb){if(m.category==='Breath'&&!cfg.reduced&&cfg.breath!=='natural'&&!['no-count-breathing','breath-following'].includes(m.id)){orb.style.transition='transform .3s linear';const [inS,hold,outS]=breathPattern(),total=inS+hold+outS;const t=(s.elapsed%total);const breatheIn=t<inS;const factor=breatheIn?.98+.16*(t/inS):1.14-.16*((t-inS)/(outS||1));orb.style.setProperty('--breath-scale',Math.min(1.14,Math.max(.97,factor)).toFixed(3));if(ol)ol.textContent=breatheIn?'Inhale':'Exhale'}else{orb.style.setProperty('--breath-scale','1');if(ol)ol.textContent=phase===m.steps.length-1?'Let go':'Rest'}}if(changed&&s.elapsed>2&&!s.paused&&m.category!=='Breath')speak(m.steps[phase]);refreshPlayer()}

function journalSave(){cfg.diary.push({date:uid(),onset:$('#journal-onset')?.value||'unknown',feel:$('#journal-feel')?.value||'unknown'});if(cfg.diary.length>180)cfg.diary.shift();save();render();toast('Morning note saved locally')}
function fileExport(){const b=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),settings:cfg},null,2)],{type:'application/json'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=`somna-backup-${uid()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup downloaded')}
function importFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(String(r.result));if(j.version!==1||!j.settings||!Array.isArray(j.settings.notes))throw Error('Invalid SOMNA backup');cfg={...defaults,...j.settings};save();render();toast('Backup imported')}catch{toast('Not a valid SOMNA backup')}};r.readAsText(file)}
function resetFilters(){state.search='';state.category='All';state.maxMinutes=99;state.evidence='all';state.flags=[];state.filterFavorites=false;state.sort='relevance';render()}
function setVal(key,val){cfg[key]=val;save();render()}
function action(act,el){const id=el.dataset.id,key=el.dataset.key;switch(act){case 'go':go(el.dataset.page);break;case 'go-studio':go('studio');break;case 'night':cfg.night=!cfg.night;if(cfg.night)state.page='studio';save();render();break;case 'cat':state.category=el.dataset.cat;render();break;case 'flag':state.flags=state.flags.includes(el.dataset.flag)?state.flags.filter(f=>f!==el.dataset.flag):[...state.flags,el.dataset.flag];render();break;case 'only-fav':state.filterFavorites=!state.filterFavorites;render();break;case 'fav':cfg.favorite=cfg.favorite.includes(id)?cfg.favorite.filter(f=>f!==id):[...cfg.favorite,id];save();if(state.page==='library')$('#method-results').innerHTML=results();else render();toast(cfg.favorite.includes(id)?'Saved to favorites':'Removed from favorites');break;case 'reset-filters':resetFilters();break;case 'method':openMethod(id);break;case 'modal-close':closeModal();break;case 'start':closeModal();startSession(id);break;case 'quick':startSession(JUMP[id]);break;case 'stack-add':if(!cfg.stack.includes(id))cfg.stack.push(id);save();closeModal();toast('Added to your sleep stack');break;case 'stack-remove':cfg.stack=cfg.stack.filter(i=>i!==id);save();render();break;case 'stack-clear':cfg.stack=[];save();render();break;case 'stack-start':startStack();break;case 'session-pause':sessionPause();break;case 'session-stop':sessionStop();break;case 'step-next':stepNext();break;case 'sound-play':soundPlay();break;case 'preset':preset(el.dataset.name);break;case 'solo-sound':break;case 'track':startTrack(id);break;case 'voice-stop':stopVoice();break;case 'voice-test':speak('You do not need to do anything right now. You can simply rest, and let these words pass by.');break;case 'tool':state.tool=id;render();break;case 'new-word':{const list=SHUFFLE_WORDS.filter(w=>w!==state.currentWord);state.currentWord=list[Math.floor(Math.random()*list.length)];const n=$('#word');if(n)n.textContent=state.currentWord;break}case 'speak-word':speak(state.currentWord);break;case 'breath-preset':cfg.breath=id;save();render();break;case 'breath-start':startSession(cfg.breath==='natural'?'no-count-breathing':'easy-4-6-breathing');break;case 'setting':cfg[key]=!cfg[key];save();render();break;case 'palette':cfg.theme=id;save();render();break;case 'save-note':noteSave();break;case 'remove-note':cfg.notes=cfg.notes.filter(n=>n.id!==id);save();render();break;case 'log-night':journalSave();break;case 'export':fileExport();break;case 'import':$('#import-file')?.click();break;case 'wipe':showModal(`<div class="row between"><span class="eyebrow">Data control</span><button class="icon-btn" data-act="modal-close">✕</button></div><h2>Erase local data?</h2><p class="muted">This clears your notes, journal, favorites, stack and settings from this browser. You cannot undo this without a backup.</p><button class="btn warn w100" data-act="wipe-confirm">Erase everything</button>`);break;case 'wipe-confirm':cfg={...defaults};save();state.session=null;stopSound();stopVoice();closeModal();go('home');toast('Local SOMNA data cleared');break;case 'references':openRefs();break;default:break}}
// Replace the solo handler with a genuine single-layer mixer state (no special audio permission).
const originalAction=action;
function onClick(e){if(e.target.closest('.modal')&&!e.target.closest('.modal [data-act]'))return;const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='solo-sound'){const k=b.dataset.key;const same=Object.keys(soundLevels).every(x=>(soundLevels[x]||0)===(x===k?0.6:0));soundLevels=Object.fromEntries(Object.keys(SOUND_LABELS).map(x=>[x,same?PRESETS[state.soundPreset][x]||0:x===k?0.6:0]));applySound();if(state.page==='audio')render();toast(same?'Restored preset':`${SOUND_LABELS[k]} solo`);return}originalAction(a,b)}
document.addEventListener('click',onClick);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.method')){e.preventDefault();openMethod(e.target.dataset.id)}if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='query'){state.search=t.value;const n=$('#method-results');if(n)n.innerHTML=results()}if(t.dataset.sound){soundLevels[t.dataset.sound]=Number(t.value);applySound();const n=$('#level-'+t.dataset.sound);if(n)n.textContent=Math.round(Number(t.value)*100)+'%'}if(t.id==='audioMaster'){cfg.audioMaster=Number(t.value);save();applySound()}if(t.id==='voiceRate'){cfg.voiceRate=Number(t.value);save();const n=$('#rate-value');if(n)n.textContent=cfg.voiceRate.toFixed(2)+'×'}if(t.id==='voiceVol'){cfg.voiceVol=Number(t.value);save();const n=$('#voice-vol-value');if(n)n.textContent=Math.round(cfg.voiceVol*100)+'%'}});
document.addEventListener('change',e=>{const t=e.target;switch(t.id){case 'time-filter':state.maxMinutes=Number(t.value);render();break;case 'evidence-filter':state.evidence=t.value;render();break;case 'sort-filter':state.sort=t.value;render();break;case 'fade-select':cfg.soundFade=Number(t.value);save();SOUND.startMs=Date.now();break;case 'voice-loops':cfg.voiceLoops=Number(t.value);save();render();break;case 'voice-select':cfg.voiceId=t.value;save();break;case 'import-file':importFile(t.files?.[0]);break}});
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=populateVoices;voices()}
function boot(){theme();render();cfg.launchCount++;save();setInterval(()=>{if(state.session?.active)updateSessionDisplay();soundTimer()},300);const splash=$('#splash');setTimeout(()=>{splash?.classList.add('done');setTimeout(()=>{if(splash)splash.hidden=true},650)},cfg.reduced?100:900);if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}}
boot();
})();
</script></body></html>
